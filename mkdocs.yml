theme:
    name: material
    palette:
        # 亮色模式
        - scheme: default
          primary: custom
          accent: custom
          toggle:
              icon: material/toggle-switch-off-outline
              name: Switch to dark mode
        # 深色模式
        - scheme: slate
          primary: custom
          accent: custom
          toggle:
              icon: material/toggle-switch
              name: Switch to light mode
    logo: assets/images/logo.svg
    favicon: assets/images/favicon.svg
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.indexes
        - toc.integrate

extra_css:
    - stylesheets/extra.css

markdown_extensions:
    - pymdownx.arithmatex:
          generic: true
    - attr_list
    - pymdownx.emoji
    - footnotes

extra_javascript:
    - javascripts/mathjax.js
    - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
